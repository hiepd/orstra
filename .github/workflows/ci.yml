name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite needs 22.13 or later.
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The git tests make commits, so git needs a name.
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npx vitest run
      - run: npm run build
