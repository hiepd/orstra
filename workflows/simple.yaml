name: Simple
description: A task waits in Todo until you start it, the agent does the work, and you review it once. A done task can be reopened from its page.

steps:
  # A new task waits here. It shows in your Inbox; press Start when you want the agent to begin.
  todo:
    title: Todo
    use: human
    question: Start this task?
    choices:
      - start
    on:
      start: work

  work:
    title: In progress
    use: agent
    prompt: |
      Do the task "{{ trigger.title }}".
      {{ trigger.description }}
      If a human left feedback or asked for more changes, address it first.
      Commit your work on this branch with a clear message.
    next: review

  # Nothing is merged: the work stays on the task's branch (orstra/<task>), and you merge it yourself.
  # Approve finishes the task: Done is the end, not a step. To ask for more later, reopen the done task.
  review:
    title: In review
    use: human
    question: Is the work good?
    on:
      approved: end
      changes_requested: work
