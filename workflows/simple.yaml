name: Simple
description: A task waits in Todo until you start it, the agent does the work, and you close it or reopen it for more changes.

steps:
  # A new task waits here. It shows in your Inbox; press Start when you want the agent to begin.
  todo:
    title: Todo
    use: human
    question: Start this task?
    choices:
      - start
    on:
      start: work

  work:
    title: In progress
    use: agent
    prompt: |
      Do the task "{{ trigger.title }}".
      {{ trigger.description }}
      If a human left feedback or asked for more changes, address it first.
      Commit your work on this branch with a clear message.
    next: done

  # Nothing is merged: the work stays on the task's branch (orstra/<task>), and you merge it yourself.
  done:
    title: Done
    use: human
    question: Is the work good? Close it, or reopen it to ask for more changes.
    choices:
      - close
      - reopen
    on:
      close: end
      reopen: work
