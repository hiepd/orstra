name: Ask first
description: The agent asks you a question before it starts, so you can chat with it.

steps:
  write:
    title: Write a poem
    use: agent
    prompt: |
      Before writing anything, ask the human which language the poem about "{{ trigger.title }}" should be in.
      End that question with the line OUTCOME: needs_you and wait for their answer.
      Once they answer, write a four-line poem in that language to poem.txt, then finish as usual.
    next: end
